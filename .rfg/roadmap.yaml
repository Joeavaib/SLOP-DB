version: 3
id: roadmap-1
hypothesis:
  id: h1
  statement: ""
goal:
  id: g1
  statement: "C++ DB Engine Welle 9 (konkurrenzfaehig): GROUP BY + Hash-Agg (Q1-Kern), Backup-Coordinator offline, chaos_raft, echter Kill-9-Harness, ANN-Squared-Hotpath + adaptive Probes. Alles verifiziert."
  profile: feature
oracles:
  - kind: test
  - kind: perf
  - kind: debug
  - kind: security
steps:
  - id: s01-scaffold
    title: s01-scaffold
    paths:
      - CMakeLists.txt
      - src/
      - include/dbengine/
      - tests/
      - LICENSE
      - README.md
    verify: cmake -S . -B build && cmake --build build -j4 && ctest --test-dir build
    engine: implement
    want: "C++20 CMake Repo-Scaffold: src/include/tests Layout, Apache-2.0 LICENSE, README Quickstart, Smoke-Test gruen"
    extras:
      - ANFORDERUNGEN.md
  - id: s02-pager
    title: s02-pager
    paths:
      - src/storage/pager.cpp
      - include/dbengine/storage/pager.h
    verify: cmake --build build -j4 && ctest --test-dir build -R pager --output-on-failure
    engine: implement
    want: "Pager+Storage: 16KB Seiten-Datei, B+Tree clustered, mmap Zero-Copy Reads, Single-File"
  - id: s03-wal
    title: s03-wal
    paths:
      - src/storage/wal.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R wal --output-on-failure
    engine: implement
    want: "WAL+Checkpoint+Recovery: REDO-Log, Checkpoint, Kill-9 Replay ohne Verlust"
  - id: s04-mvcc
    title: s04-mvcc
    paths:
      - src/txn/mvcc.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R mvcc --output-on-failure
    engine: implement
    want: "MVCC+Txn: Undo-Log, Snapshot-Isolation default, Single-Shard ACID"
  - id: s05-kv
    title: s05-kv
    paths:
      - src/kv/kv.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R kv --output-on-failure
    engine: implement
    want: "KV-API nativ: Get/Put/Delete/Scan/Iterator, WriteBatch atomar"
  - id: s06-sql
    title: s06-sql
    paths:
      - src/sql/parser.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R sql --output-on-failure
    engine: implement
    want: "SQL+PGWire Subset: CREATE/INSERT/SELECT mit Filter, JSONB-Stub, libpq-Handshake"
  - id: s07-index
    title: s07-index
    paths:
      - src/index/btree.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R index --output-on-failure
    engine: implement
    want: "Sekundaer-Indexe: B-Tree secondary, ART/GIN-Stub, TTL-Stub"
  - id: s08-vector
    title: s08-vector
    paths:
      - src/vector/hnsw.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R vector --output-on-failure
    engine: implement
    want: "Vektor first-class: VECTOR Typ, filterbarer HNSW-basic, ef runtime-tunbar, Recall@10>0.9 Bench"
  - id: s09-hybrid
    title: s09-hybrid
    paths:
      - src/search/hybrid.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R hybrid --output-on-failure
    engine: implement
    want: "Hybrid Search: BM25+dense Fusion mit RRF, Filter+ANN gemeinsam evaluiert"
  - id: s10-columnar
    title: s10-columnar
    paths:
      - src/columnar/store.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R columnar --output-on-failure
    engine: implement
    want: "Columnar-Tiering: Immutable Parts Parquet-like, Dict/RLE Stub, Arrow-Export, S3-Tier Stub"
  - id: s11-executor
    title: s11-executor
    paths:
      - src/sql/executor.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R executor --output-on-failure
    engine: implement
    want: "Integration: SQL-Executor auf KV+MVCC+WAL verdrahtet, INSERT persistent, SELECT snapshot-konsistent"
  - id: s12-pgserver
    title: s12-pgserver
    paths:
      - src/server/pgserver.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R pgserver --output-on-failure
    engine: implement
    want: "PG-Server live: TCP accept, Startup/Q-Flow über Socket, psql-kompatibler Smoke (SELECT 1)"
  - id: s13-raft
    title: s13-raft
    paths:
      - src/raft/shard.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R raft --output-on-failure
    engine: implement
    want: "Raft-Shard Stub: Range/Tablet (96MB logisch), Leader-Election, Log-Replikation 3er-Gruppe simuliert, Failover-Test"
  - id: s14-clock
    title: s14-clock
    paths:
      - src/txn/clock.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R clock --output-on-failure
    engine: implement
    want: "TSO/HLC: Timestamp-Oracle + Hybrid-Logical-Clock, Commit-Wait, globale Snapshot-Reads monoton"
  - id: s15-jsonb
    title: s15-jsonb
    paths:
      - src/sql/jsonb.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R jsonb --output-on-failure
    engine: implement
    want: "JSONB: Binär-JSON Typ, GIN-Inverted-Index, Operatoren ->/->>/@>, SELECT mit JSON-Filter"
  - id: s16-quant
    title: s16-quant
    paths:
      - src/vector/quant.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R quant --output-on-failure
    engine: implement
    want: "Vektor-Scale: SQ8/PQ-Quant echt, Disk-Spill, ef-Autotune, 1M-Bench Recall>0.9 dokumentiert"
  - id: s17-ts
    title: s17-ts
    paths:
      - src/ts/chunks.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R chunks --output-on-failure
    engine: implement
    want: "Time-Series: Hypertable-Chunks, Retention-Drop, Downsampling Continuous-Agg, ASOF-Join Stub"
  - id: s18-bench
    title: s18-bench
    paths:
      - tools/bench.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R bench --output-on-failure
    engine: implement
    want: "Bench-Harness: CLI dbbench mit KV-Throughput, SQL TPC-H-like Q1, ANN Recall/Latenz, CSV-Report"
  - id: s19-chaos
    title: s19-chaos
    paths:
      - tests/test_chaos.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R chaos --output-on-failure
    engine: implement
    want: "Fuzz/Chaos: deterministischer Crash-Fuzz (Seed), WAL-Torn-Write, ASAN/UBSAN-clean, 10k Ops kein Verlust"
    extras:
      - CMakeLists.txt
      - SBOM.md
      - docs/ARCH.md
      - docs/RUNBOOK.md
      - docs/SBOM.md
  - id: s20-docs
    title: s20-docs
    paths:
      - docs/ARCH.md
    verify: cmake --build build -j4 && ctest --test-dir build -R docs --output-on-failure
    engine: implement
    want: "Docs/Ops: ARCH.md (Schichten, WAL, MVCC, Shard), Runbook, k8s-manifest Stub, SBOM-Liste, API-Doku"
    extras:
      - CMakeLists.txt
      - SBOM.md
      - docs/RUNBOOK.md
      - docs/SBOM.md
      - k8s/statefulset.yaml
  - id: s21-hnsw
    title: s21-hnsw
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: cmake --build build -j4 && ctest --test-dir build -R vector --output-on-failure
    engine: implement
    want: "Echter mehrschichtiger HNSW: Level-Sampling (mL), Entry-Point, efConstruction, M/Mmax getrennt, inkrementelles Insert ohne O(N2)-Rebuild, filterbar, Recall@10>0.95 vs brute_force"
  - id: s22-pqadc
    title: s22-pqadc
    paths:
      - src/vector/quant.cpp
      - include/dbengine/vector/quant.h
    verify: cmake --build build -j4 && ctest --test-dir build -R quant --output-on-failure
    engine: implement
    want: "PQ-N echt + IVF-Coarse: konfigurierbare Subspaces (N=2/4/8/16), k-means fit deterministisch, ADC-Lookup-Tabellen, IVF-Coarse mit nlist/probes + Re-Rank, Recall/Latenz-Bench"
  - id: s23-walgroup
    title: s23-walgroup
    paths:
      - src/storage/wal.cpp
      - include/dbengine/storage/wal.h
    verify: cmake --build build -j4 && ctest --test-dir build -R wal --output-on-failure
    engine: implement
    want: "WAL Gruppencommit echt: append-Queue + Group-Commit-Flusher (Batch-fsync), WAIT FOR LSN (wait_for_lsn mit Timeout), CDC-Slots (subscribe/ab LSN replay), Crash-Safety nach flush erhalten"
  - id: s24-colfile
    title: s24-colfile
    paths:
      - src/columnar/store.cpp
      - include/dbengine/columnar/store.h
    verify: cmake --build build -j4 && ctest --test-dir build -R columnar --output-on-failure
    engine: implement
    want: "Columnar File+Merge echt: persistentes Part-File (Header+Chunks+RLE/Dict), Load/Save, Merge/Compaction (sorted merge + Zonemaps), vektorierter Scan mit Pruning, S3-Stage weiter Stub-frei dokumentiert"
  - id: s25-raftnet
    title: s25-raftnet
    paths:
      - src/raft/shard.cpp
      - include/dbengine/raft/shard.h
    verify: cmake --build build -j4 && ctest --test-dir build -R raft --output-on-failure
    engine: implement
    want: "Raft-Transport echt: TCP-Framing (len-prefixed Entry-Replikation), persistentes Log (Datei + Replay), Snapshots (State-Machine dump/load), Follower-Reads (read_index light), Split/Merge vorbereitet"
  - id: s26-docsv2
    title: s26-docsv2
    paths:
      - docs/ARCH.md
    verify: cmake --build build -j4 && ctest --test-dir build -R docs --output-on-failure
    engine: implement
    want: "Doku V2: ARCH.md ergaenzt Mehrschicht-HNSW, PQ-N+IVF, WAL Group-Commit/LSN-Wait/CDC, COL1-File+Merge/Compact, Raft-TCP/Log/Snapshot/Split; stalen V1-Grenzen-Abschnitt korrigiert"
  - id: s27-colpersist
    title: s27-colpersist
    paths:
      - src/columnar/store.cpp
      - include/dbengine/columnar/store.h
    verify: cmake --build build -j4 && ctest --test-dir build -R columnar --output-on-failure
    engine: implement
    want: "Columnar-Crashfix: Save persistiert aktiven Part (Load stellt ihn unsealed wieder her, TotalRows erhalten), tmp+rename+fsync fuer Parts+Manifest (Manifest zuletzt), alte Export-API unveraendert"
  - id: s28-raftcorrect
    title: s28-raftcorrect
    paths:
      - src/raft/shard.cpp
      - include/dbengine/raft/shard.h
    verify: cmake --build build -j4 && ctest --test-dir build -R raft --output-on-failure
    engine: implement
    want: "Raft-Korrektheit: LoadSnapshot setzt last_applied=last_idx und replayt Tail (kein Commit-Verlust), LoadLog resettet State-Machine (keine Phantoms), opt-in Autosave-Pfad, tmp+rename+fsync Saves"
  - id: s29-execmvcc
    title: s29-execmvcc
    paths:
      - src/sql/executor.cpp
      - include/dbengine/sql/executor.h
    verify: cmake --build build -j4 && ctest --test-dir build -R executor --output-on-failure
    engine: implement
    want: "Executor Snapshot-Reads: SELECT ohne MVCC-Commit unsichtbar (kein KV-Fallback-Dirty-Read), recover() zaehlt Skips, next_rowid aus Max-Suffix, alte Tests gruene"
  - id: s30-chaoswide
    title: s30-chaoswide
    paths:
      - tests/test_chaos.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R chaos --output-on-failure
    engine: implement
    want: "Chaos-Abdeckung: WAL checkpoint/CDC/wait_for_lsn interleaved im Fuzz (KV+WAL-Link beibehalten), deterministisch Seed 42, Verlust 0"
  - id: s31-runbook
    title: s31-runbook
    paths:
      - docs/RUNBOOK.md
    verify: cmake --build build -j4 && ctest --test-dir build -R docs --output-on-failure
    engine: implement
    want: "RUNBOOK-Wahrheit: Kill-9-Absatz mit flush-Vorbehalt, Raft/Columnar-Persistenzgrenzen dokumentiert, docs-Guard Keywords erhalten"
  - id: s32-simd
    title: s32-simd
    paths:
      - src/vector/hnsw.cpp
      - src/vector/quant.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: SIMD-Distanzkerne (AVX2-Runtime-Dispatch + skalarer Fallback) fuer L2/Cosine in HNSW+Quant, Bit-identische Rankings, Recall unveraendert, deutlich schneller
  - id: s33-walfast
    title: s33-walfast
    paths:
      - src/storage/wal.cpp
      - src/kv/kv.cpp
      - include/dbengine/storage/wal.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"wal|kv|chaos\" --output-on-failure"
    engine: implement
    want: "WAL/KV-Durchsatz: ein writev pro Record, weniger Kopien/Allokationen im Append-Pfad, Semantik (LSN/durable/Checkpoint) unveraendert"
  - id: s34-hnswperf
    title: s34-hnswperf
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "HNSW-Overhead runter: Build ohne Distanz-Rescans (Scores wiederverwenden, Shrink frequenz-/kostenguenstig), Suche ohne Per-Query-Allokationsflut, Recall >= Stand, Latenz/Build deutlich schneller"
  - id: s35-hnswsmart
    title: s35-hnswsmart
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "Suchpfad-Effizienz: diversifizierte Nachbar-Heuristik (besserer Graph), weniger Seeds/Beam bei gleichem Recall, Latenz runter ohne Recall-Verlust"
  - id: s36-hnswentry
    title: s36-hnswentry
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "Entry-Diversifizierung: Multi-Start-Descent ueber obere Layer (deterministisch), Queries entkommen falschem Cluster, uniform-Recall >= Stand, clustered-Recall hoch"
  - id: s37-hnswcross
    title: s37-hnswcross
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "Cross-Cluster-Kanten beim Insert: deterministische Spread-Probes ergaenzen Beam-Kandidaten, diversifizierte Selektion behaelt Fernkanten, clustered-Recall hoch, uniform >= Stand"
  - id: s38-nvmebench
    title: s38-nvmebench
    paths:
      - tools/bench.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R bench --output-on-failure
    engine: implement
    want: "dbbench --data-dir: WAL append_many+flush Throughput + p95-flush-Latenz auf beliebigem Verzeichnis (NVMe vs tmpfs vergleichbar), CSV-Output erweitert, alte Modi unveraendert"
  - id: s39-sumexpr
    title: s39-sumexpr
    paths:
      - src/sql/parser.cpp
      - include/dbengine/sql/parser.h
      - src/sql/executor.cpp
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"sql|executor\" --output-on-failure"
    engine: implement
    want: Skalar-Aggregate SUM/AVG/MIN/MAX + COUNT(col), Arg = Spalte oder binaerer */+-Ausdruck (Q6 SUM(price*disc) gruen), ohne GROUP BY, alte Tests gruene
  - id: s40-shrinksym
    title: s40-shrinksym
    paths:
      - src/vector/hnsw.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "Symmetrische Shrink-Heuristik: reziproke Kantenstuetzung mit Diversitaets-Heuristik statt naechste-only, Fernkanten bleiben, clustered-Recall hoch, uniform >= Stand"
  - id: s41-pgsession
    title: s41-pgsession
    paths:
      - src/server/pgserver.cpp
      - include/dbengine/server/pgserver.h
    verify: cmake --build build -j4 && ctest --test-dir build -R pgserver --output-on-failure
    engine: implement
    want: "PGWire-Session echt: Q an Executor::execute verdrahtet, echte T/D/C (OIDs, NULLs), SELECT-1 weiter gruene, alte Tests gruene"
  - id: s42-metrics
    title: s42-metrics
    paths:
      - src/server/metrics.cpp
      - include/dbengine/server/metrics.h
      - CMakeLists.txt
    verify: cmake --build build -j4 && ./build/dbmetrics --selfcheck
    engine: implement
    want: "Metrics-Endpoint: TCP GET /metrics mit WAL/RAFT/Columnar/HNSW-Kennzahlen (Prometheus-Textformat), dbmetrics-Binary mit --selfcheck (ephemeral, asserted Keywords), STL/POSIX-only"
  - id: s43-groupby
    title: s43-groupby
    paths:
      - src/sql/parser.cpp
      - include/dbengine/sql/parser.h
      - src/sql/executor.cpp
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"sql|executor\" --output-on-failure"
    engine: implement
    want: GROUP BY + Hash-Aggregation mit SUM/AVG/MIN/MAX/COUNT (Q1-Kern ohne ORDER BY), AS-Aliase, alte Tests gruene
  - id: s44-backup
    title: s44-backup
    paths:
      - src/server/backup.cpp
      - include/dbengine/server/backup.h
      - CMakeLists.txt
    verify: cmake --build build -j4 && ./build/dbbackup --selfcheck
    engine: implement
    want: "Backup-Coordinator offline: flush+Save aller Engines + MANIFEST zuletzt (tmp+rename), restore mit Replay-Tail, dbbackup-Binary mit --selfcheck, STL/POSIX-only"
  - id: s45-chaosraft
    title: s45-chaosraft
    paths:
      - tests/test_raft.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R raft --output-on-failure
    engine: implement
    want: "chaos_raft: Save/Kill/Load + Snapshot + Failover-Sequenzen deterministisch (Seeds), Commit-Monotonie, Phantom-Freiheit, alte Tests gruene"
  - id: s46-kill9
    title: s46-kill9
    paths:
      - tests/test_wal.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R wal --output-on-failure
    engine: implement
    want: "Echter Kill-9-Harness: fork+kill -9 vor/nach flush und mitten in checkpoint, Reopen-Replay = Prefix-Modell, Verlust 0 nach flush, alte Tests gruene"
  - id: s47-annfine
    title: s47-annfine
    paths:
      - src/vector/hnsw.cpp
      - src/vector/quant.cpp
      - include/dbengine/vector/hnsw.h
    verify: "cmake --build build -j4 && ctest --test-dir build -R \"vector|quant\" --output-on-failure"
    engine: implement
    want: "ANN-Feinschliff: squared-Hotpath ohne sqrt pro Kandidat, adaptive Query-Probes P=min(256,N/64), Recall >= Stand, kleine N deutlich schneller"
