version: 3
id: roadmap-1
hypothesis:
  id: h1
  statement: ""
goal:
  id: g1
  statement: "C++ DB Engine Welle 22: Virtuelle L2/L3-Sandbox + Dummy-App-Load + Stabilitäts/Speed-Duell. Alles verifiziert."
  profile: feature
oracles:
  - kind: test
  - kind: perf
  - kind: debug
  - kind: security
steps:
  - id: s01-scaffold
    title: s01-scaffold
    paths:
      - CMakeLists.txt
      - src/
      - include/dbengine/
      - tests/
      - LICENSE
      - README.md
    verify: cmake -S . -B build && cmake --build build -j4 && ctest --test-dir build
    engine: implement
    want: "C++20 CMake Repo-Scaffold: src/include/tests Layout, Apache-2.0 LICENSE, README Quickstart, Smoke-Test gruen"
    extras:
      - ANFORDERUNGEN.md
  - id: s02-pager
    title: s02-pager
    paths:
      - src/storage/pager.cpp
      - include/dbengine/storage/pager.h
    verify: cmake --build build -j4 && ctest --test-dir build -R pager --output-on-failure
    engine: implement
    want: "Pager+Storage: 16KB Seiten-Datei, B+Tree clustered, mmap Zero-Copy Reads, Single-File"
  - id: s03-wal
    title: s03-wal
    paths:
      - src/storage/wal.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R wal --output-on-failure
    engine: implement
    want: "WAL+Checkpoint+Recovery: REDO-Log, Checkpoint, Kill-9 Replay ohne Verlust"
  - id: s04-mvcc
    title: s04-mvcc
    paths:
      - src/txn/mvcc.cpp
    verify: cmake --build build -j4 && ctest --test-dir build -R mvcc --output-on-failure
    engine: implement
    want: "MVCC+Txn: Undo-Log, Snapshot-Isolation default, Single-Shard ACID"
